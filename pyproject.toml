[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-request-classifier"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
train = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.5", "threadpoolctl>=3"]
runtime = ["numpy>=1.26", "onnxruntime>=1.20", "tokenizers>=0.21"]
encoder = ["torch>=2.6", "transformers>=4.51,<5", "onnx>=1.17"]

[tool.setuptools.packages.find]
include = ["legal_gate*"]
